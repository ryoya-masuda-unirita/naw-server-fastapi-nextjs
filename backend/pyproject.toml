[project]
name = "naw-server-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "greenlet>=3.5.3",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-search-documents>=11.5.1",
    "openai>=1.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bcrypt>=4.0.0,<5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# sys.path.insert() を先に実行してからimportする意図的な構造のため、
# 「モジュールレベルのimportがファイル先頭にない」という指摘を無効化する。
"tests/unit/conftest.py" = ["E402"]

[tool.mypy]
# 標準実行コマンド: `cd backend && uv run mypy app tests`
# `files` も明示しておくことで、引数なしの `uv run mypy` でも同じ対象範囲になる。
files = ["app", "tests"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# ignore（無視）を付けたが実際にはエラーが出ていない箇所を検出する。
# 型エラーが解消された後に不要な ignore が残るのを防ぐための運用設定。
warn_unused_ignores = true
# 不要な cast() を検出する。
warn_redundant_casts = true

# --- 初期導入時点では対象外にするモジュール ---
# 理由: docs/issue-139/03_詳細設計.md で調査済みの通り、SQLModel のモデル属性は
# mypy 上では宣言した Python 型（str/datetime/UUID/bool 等）としてしか認識されず、
# `Model.field == value` のような SQLAlchemy 的な比較式を `.where()` / `.join()` /
# `.in_()` / `.desc()` / `.asc()` / `.is_()` に渡す書き方が、実行時には正しく動作する
# にもかかわらず mypy 上は型エラーになる（SQLModel に InstrumentedAttribute を認識
# させる mypy プラグインが存在しないための構造的な限界）。
# リポジトリ層のクエリ構築パターンを変えない限り根本解消できないため、初期導入では
# 該当モジュールを除外し、無理に `# type: ignore` を大量に付けない方針とする。
# 除外の要否・解消方針は #141（エラー修正）で改めて判断する。
[[tool.mypy.overrides]]
module = [
    "app.repositories.*",
    "app.services.user_service",
    "app.services.user_import_service",
    "app.core.credit_quota",
]
ignore_errors = true
