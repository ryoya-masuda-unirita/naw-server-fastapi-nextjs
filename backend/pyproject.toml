[project]
name = "naw-server-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "greenlet>=3.5.3",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-costmanagement>=4.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bcrypt>=4.0.0,<5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# sys.path.insert() を先に実行してからimportする意図的な構造のため、
# 「モジュールレベルのimportがファイル先頭にない」という指摘を無効化する。
"tests/unit/conftest.py" = ["E402"]

[tool.mypy]
plugins = ["pydantic.mypy"]
