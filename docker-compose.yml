services:
  postgres:
    image: postgres:18
    container_name: naw-fastapi-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      TZ: Asia/Tokyo
      PGDATA: /var/lib/postgresql/18/data
    ports:
      - "5433:5432"
    volumes:
      - naw_fastapi_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: naw-fastapi-redis
    ports:
      - "6380:6379"
    volumes:
      - naw_fastapi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: naw-fastapi-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://root:root@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - naw_fastapi_backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile.dev
    container_name: naw-fastapi-frontend-angular
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "4201:4201"
    volumes:
      - ./frontend-angular:/app
      - naw_fastapi_frontend_angular_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  naw_fastapi_pgdata:
  naw_fastapi_redisdata:
  naw_fastapi_backend_venv:
  naw_fastapi_frontend_angular_node_modules:
