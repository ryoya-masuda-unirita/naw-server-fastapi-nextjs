# ローカル開発用。`docker compose up -d --build` で、DB のマイグレーション・ログイン用データ・デモデータ・画面まで立ち上がる
# （画面 http://localhost:5173、テナント test-tenant、admin / admin@1234）。
# 変えたい値（ホストのポート、SECRET_KEY など）は、このディレクトリの .env で指定する（例は .env.example。.env がなくても動く）。
# 必要なサービスだけを起動してもよい（例: docker compose up -d postgres redis localstack）。

# backend と migrate が共有する、アプリの環境変数（コンテナ間の接続先は固定値、人が変える値は .env から）
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://root:root@postgres:5432/postgres
  REDIS_URL: redis://redis:6379/0
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: ap-northeast-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_S3_BUCKET_NAME: secuaigent-user-import-jobs-dev-local
  AWS_SQS_QUEUE_URL: http://localstack:4566/000000000000/secuaigent-user-import-jobs-queue-dev-local
  SECRET_KEY: ${SECRET_KEY:-dev-secret-not-for-production}
  # 画面（別のポート）から backend を呼べるようにする
  CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
  # ローカルは HTTP のため、Cookie に Secure を付けない
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}

# backend と migrate が共有する、イメージとソースのバインドマウント（ソースは ./server を /app に載せる）
x-backend-build: &backend-build
  build:
    context: ./server
    dockerfile: Dockerfile.dev
  image: naw-fastapi-backend
  volumes:
    - ./server:/app
    - naw_fastapi_backend_venv:/app/.venv

services:
  # backend の DB（PostgreSQL）
  postgres:
    image: postgres:18
    container_name: naw-fastapi-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      TZ: Asia/Tokyo
      PGDATA: /var/lib/postgresql/18/data
    ports:
      - "5433:5432"
    volumes:
      - naw_fastapi_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # クラウドの RAG のベクトル DB（pgvector）。#461。bedrock-ext と同じ Python 版だけの拡張
  # backend からは postgresql://vector@vector-db:5432/vector（パスワード vector）
  vector-db:
    image: pgvector/pgvector:pg17
    container_name: naw-fastapi-vector-db
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
      TZ: Asia/Tokyo
    ports:
      - "5434:5432"
    volumes:
      - naw_fastapi_vectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ログインセッションの保存先
  redis:
    image: redis:7
    container_name: naw-fastapi-redis
    ports:
      - "6380:6379"
    volumes:
      - naw_fastapi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # AWS（S3・SQS）の偽物。ユーザーの一括登録で使う
  localstack:
    image: localstack/localstack:3
    container_name: naw-fastapi-localstack
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: ap-northeast-1
    ports:
      - "4566:4566"
    volumes:
      - naw_fastapi_localstack_data:/var/lib/localstack
      - ./docker-compose/localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # DB のテーブルを作る（alembic のマイグレーション）。終わったら終了する
  migrate:
    <<: *backend-build
    environment: *backend-env
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # 初期データ（ログイン用のテナント・ユーザーとデモデータ）を入れる。何度流しても壊れない（ON CONFLICT）。終わったら終了する
  seed:
    image: postgres:18
    environment:
      PGPASSWORD: root
    volumes:
      - ./server/seed.sql:/seed/seed.sql:ro
      - ./server/seed-demo.sql:/seed/seed-demo.sql:ro
    command: ["sh", "-c", "psql -h postgres -U root -d postgres -v ON_ERROR_STOP=1 -q -f /seed/seed.sql && psql -h postgres -U root -d postgres -v ON_ERROR_STOP=1 -q -f /seed/seed-demo.sql"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # FastAPI の backend
  backend:
    <<: *backend-build
    container_name: naw-fastapi-backend
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # React の画面（Vite の開発サーバー）。ソースはイメージに入れる（直したら --build で作り直す）
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: naw-fastapi-frontend
    environment:
      # ブラウザ（ホスト）から見た backend の URL
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8001}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60
    depends_on:
      backend:
        condition: service_healthy

volumes:
  naw_fastapi_vectordata:
  naw_fastapi_pgdata:
  naw_fastapi_redisdata:
  naw_fastapi_localstack_data:
  naw_fastapi_backend_venv:
