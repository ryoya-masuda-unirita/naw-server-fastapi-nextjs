<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <style>
      .tx{font-family:"Hiragino Sans","Yu Gothic",sans-serif;fill:#162238}.title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#596b82}.section{font-size:21px;font-weight:700;fill:#fff}.h{font-size:23px;font-weight:700}.p{font-size:18px}.small{font-size:16px}.tiny{font-size:14px}.shell{fill:#f7faff;stroke:#285783;stroke-width:2.5}.vpc{fill:#f7fff9;stroke:#23864d;stroke-width:2.5}.subnet{fill:#fff;stroke:#56a66e;stroke-width:2}.card{fill:#fff;stroke:#315f91;stroke-width:2.5}.compute{fill:#fff9ef;stroke:#ed8b16;stroke-width:2.5}.db{fill:#f7f4ff;stroke:#6854bd;stroke-width:2.5}.cache{fill:#effbf9;stroke:#258b81;stroke-width:2.5}.orange{fill:#ed7d0c}.green{fill:#2d913d}.purple{fill:#7554d9}.magenta{fill:#9a3d99}.navy{fill:#194b79}.teal{fill:#198d82}.pill{fill:#fff2c8;stroke:#d79b05;stroke-width:1.3}.pillblue{fill:#e7f1ff;stroke:#4b82bd;stroke-width:1.3}.pillgreen{fill:#ddf6e6;stroke:#2b9858;stroke-width:1.3}.icon{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}.data{fill:none;stroke:#263a55;stroke-width:3;marker-end:url(#arrow)}.admin{fill:none;stroke:#ba6a16;stroke-width:3;marker-end:url(#arrowOrange)}.deploy{fill:none;stroke:#58708c;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrowGray)}.edge{fill:none;stroke:#25834b;stroke-width:3}.legend{fill:#f5f8fc;stroke:#8ca6c2;stroke-width:1.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#263a55"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ba6a16"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58708c"/></marker>
  </defs>
  <rect width="1920" height="1200" fill="#fff"/>
  <text class="tx title" x="55" y="55">今回の構成（Issue #158）</text>
  <text class="tx sub" x="55" y="84">コスト最小化 / パブリックサブネットのみ / 単一障害点あり</text>

  <rect class="shell" x="50" y="110" width="1820" height="140" rx="14"/>
  <rect class="navy" x="50" y="110" width="220" height="38" rx="12"/>
  <text class="tx section" x="75" y="137">インターネット</text>
  <rect class="card" x="145" y="165" width="320" height="58" rx="9"/>
  <text class="tx h" x="305" y="201" text-anchor="middle">利用者のブラウザ</text>
  <rect class="card" x="1430" y="156" width="350" height="72" rx="9"/>
  <text class="tx h" x="1605" y="185" text-anchor="middle">作業者</text>
  <text class="tx small" x="1605" y="211" text-anchor="middle">踏み台SSH接続元IP</text>

  <rect class="card" x="650" y="280" width="620" height="105" rx="12"/>
  <rect class="purple" x="650" y="280" width="90" height="105" rx="12"/>
  <text class="icon" x="695" y="342">CF</text>
  <text class="tx h" x="770" y="318">CloudFront（グローバル）</text>
  <text class="tx p" x="770" y="347">Price Class 100</text>
  <text class="tx small" x="770" y="372">default: /* → S3　　/api/*, /auth/* → ALB</text>

  <rect class="shell" x="50" y="425" width="1820" height="700" rx="14"/>
  <rect class="navy" x="50" y="425" width="455" height="40" rx="12"/>
  <text class="tx section" x="75" y="453">AWSアカウント（ap-northeast-1）</text>

  <rect class="compute" x="95" y="505" width="355" height="110" rx="11"/>
  <rect class="green" x="95" y="505" width="78" height="110" rx="11"/>
  <text class="icon" x="134" y="570">S3</text>
  <text class="tx h" x="198" y="540">S3</text>
  <text class="tx small" x="198" y="568">naw-fastapi-issue158-frontend</text>
  <text class="tx small" x="198" y="594">frontend-angular ビルド成果物</text>
  <rect class="pillgreen" x="338" y="516" width="96" height="27" rx="13"/>
  <text class="tx tiny" x="386" y="534" text-anchor="middle">OACのみ許可</text>

  <rect class="compute" x="95" y="845" width="355" height="100" rx="11"/>
  <rect class="orange" x="95" y="845" width="78" height="100" rx="11"/>
  <text class="icon" x="134" y="903">ECR</text>
  <text class="tx h" x="198" y="884">ECR</text>
  <text class="tx small" x="198" y="914">naw-fastapi-issue158-backend</text>

  <rect class="vpc" x="500" y="485" width="1320" height="580" rx="14"/>
  <text class="tx h" x="530" y="522">VPC 10.0.0.0/16</text>
  <text class="tx small" x="760" y="521">パブリックサブネット×2 / AZ自動選択 / NAT Gatewayなし</text>

  <rect class="card" x="820" y="545" width="600" height="90" rx="11"/>
  <rect class="purple" x="820" y="545" width="82" height="90" rx="11"/>
  <text class="icon" x="861" y="597">ALB</text>
  <text class="tx h" x="930" y="580">Application Load Balancer</text>
  <text class="tx small" x="930" y="608">HTTPS / sslip.io + Let's Encrypt</text>

  <rect class="subnet" x="545" y="680" width="580" height="330" rx="12"/>
  <text class="tx h" x="570" y="716">パブリックサブネット 10.0.1.0/24</text>
  <rect class="subnet" x="1165" y="680" width="610" height="330" rx="12"/>
  <text class="tx h" x="1190" y="716">パブリックサブネット 10.0.2.0/24</text>

  <rect class="compute" x="605" y="750" width="460" height="105" rx="11"/>
  <rect class="orange" x="605" y="750" width="82" height="105" rx="11"/>
  <text class="icon" x="646" y="797">ECS</text>
  <text class="tx tiny" x="646" y="829" text-anchor="middle" fill="#fff" style="fill:#fff">単一構成</text>
  <text class="tx h" x="714" y="790">ECSホスト t4g.nano</text>
  <text class="tx p" x="714" y="825">backend（FastAPI）コンテナ</text>

  <rect class="card" x="1235" y="750" width="440" height="105" rx="11"/>
  <rect class="magenta" x="1235" y="750" width="82" height="105" rx="11"/>
  <text class="icon" x="1276" y="797">EC2</text>
  <text class="tx tiny" x="1276" y="829" text-anchor="middle" fill="#fff" style="fill:#fff">単一構成</text>
  <text class="tx h" x="1344" y="792">踏み台 EC2 t4g.nano</text>
  <text class="tx small" x="1344" y="823">管理アクセス専用</text>

  <rect class="db" x="570" y="890" width="290" height="100" rx="10"/>
  <text class="tx h" x="590" y="922">RDS PostgreSQL</text>
  <text class="tx small" x="590" y="949">5432 / db.t4g.micro</text>
  <text class="tx small" x="590" y="976">Single-AZ / パブリックアクセス無効</text>
  <rect class="cache" x="880" y="890" width="230" height="100" rx="10"/>
  <text class="tx h" x="900" y="922">Redis</text>
  <text class="tx small" x="900" y="949">6379 / cache.t4g.micro</text>
  <text class="tx small" x="900" y="976">レプリカ0</text>

  <rect class="card" x="1415" y="900" width="275" height="80" rx="10"/>
  <text class="tx h" x="1552" y="932" text-anchor="middle">Internet Gateway</text>
  <text class="tx small" x="1552" y="958" text-anchor="middle">VPCインターネット接続</text>

  <!-- data plane: every path uses open corridors and terminates at card edges -->
  <path class="data" d="M305 223V280H650"/>
  <path class="data" d="M790 385V475H450V505"/>
  <path class="data" d="M1015 385V470H1150V545"/>
  <path class="data" d="M1030 635V655H1090V730H835V750"/>
  <path class="data" d="M710 855V890"/>
  <path class="data" d="M960 855V890"/>

  <!-- deployment and administration run in dedicated side/bottom lanes -->
  <path class="deploy" d="M450 895H520V802H605"/>
  <path class="admin" d="M1605 228V750"/>
  <path class="admin" d="M1455 855V875H1375V1035H712V990"/>
  <path class="edge" d="M1690 940H1820"/>

  <rect class="legend" x="50" y="1145" width="1820" height="42" rx="8"/>
  <line x1="80" y1="1166" x2="145" y2="1166" stroke="#263a55" stroke-width="3"/><text class="tx small" x="160" y="1172">実線（紺）: アプリケーション通信</text>
  <line x1="515" y1="1166" x2="580" y2="1166" stroke="#ba6a16" stroke-width="3"/><text class="tx small" x="595" y="1172">実線（橙）: 管理通信</text>
  <line x1="850" y1="1166" x2="915" y2="1166" stroke="#58708c" stroke-width="3" stroke-dasharray="10 8"/><text class="tx small" x="930" y="1172">点線: image pull</text>
  <rect class="pill" x="1345" y="1152" width="500" height="28" rx="14"/><text class="tx small" x="1595" y="1172" text-anchor="middle">NAT Gatewayなし / ECS・RDS・Redis・踏み台は単一構成</text>
</svg>
