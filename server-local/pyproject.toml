[project]
name = "naw-server-local"
version = "0.1.0"
description = "secuaigent-server-local（Spring Boot）の FastAPI 移植版。SECURE アシスタント用のローカルサーバー"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "greenlet>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy の非同期処理は greenlet 上で動くため、指定しないと計測から漏れる
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 88
