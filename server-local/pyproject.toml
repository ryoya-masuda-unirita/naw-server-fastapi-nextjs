[project]
name = "naw-server-local"
version = "0.1.0"
description = "secuaigent-server-local（Spring Boot）の FastAPI 移植版。SECURE アシスタント用のローカルサーバー"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "greenlet>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy の非同期処理は greenlet 上で動くため、指定しないと計測から漏れる
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# 既定のルール（E4・E7・E9・F）に、docstring の記載漏れを検出する pydocstyle のルールを足す（Issue #311）。
# D101: public クラス / D102: public メソッド / D103: public 関数 / D105: マジックメソッド /
# D106: public なネストしたクラス / D107: __init__ / D417: Parameters 節に引数の説明が漏れている。
# numpy 規約は D107・D417 を既定で外すが、ここで明示して有効にしている。
# モジュール・パッケージの docstring（D100・D104）は任意のため有効にしない。
# private（_ 付き）の関数・クラスは ruff では検出できないが、規約として同じく docstring を書く。
extend-select = ["D101", "D102", "D103", "D105", "D106", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
# NumPy 形式（Parameters / Returns / Raises の節）で書く。D417 は Parameters 節を見て判定する
convention = "numpy"
