[project]
name = "naw-waha-emulator"
version = "0.1.0"
description = "Waha!（servicerun API）のエミュレーター。server-local から SECURE アシスタントのチャットを通しで動かすための代わりのサービス"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "openai>=1.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    # server-local との結合テストで server-local のアプリ（SQLite + SQLModel）を読み込むため
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.mypy]
# 標準実行コマンド: `cd waha-emulator && uv run mypy`
files = ["waha_emulator", "tests"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# 結合テストで読み込む server-local のパッケージ（`app`）は型検査の対象外にする
module = ["app", "app.*"]
ignore_missing_imports = true
follow_imports = "skip"
