[project]
name = "naw-waha-emulator"
version = "0.1.0"
description = "Waha!（servicerun API）のエミュレーター。server-local から SECURE アシスタントのチャットを通しで動かすための代わりのサービス"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # 生成AIアダプタ・検索アダプタ（ルートの generative-ai-adapter/ の uv ワークスペース。core も一緒に入る）
    "naw-generative-ai-adapter",
    "naw-retrieval-adapter",
    # 埋め込みアダプタ（同じワークスペース。ベクトルDB への登録・削除）
    "naw-embedding-adapter",
]

[tool.uv.sources]
naw-generative-ai-adapter = { path = "../generative-ai-adapter/generative-ai-adapter", editable = true }
naw-retrieval-adapter = { path = "../generative-ai-adapter/retrieval-adapter", editable = true }
naw-embedding-adapter = { path = "../generative-ai-adapter/embedding-adapter", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    # 生成AIアダプタの LLM への HTTP をモックする
    "respx>=0.21.0",
    # server-local との結合テストで server-local のアプリ（SQLite + SQLModel）を読み込むため
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# 既定のルール（E4・E7・E9・F）に、docstring の記載漏れを検出する pydocstyle のルールを足す（Issue #311）。
# D101: public クラス / D102: public メソッド / D103: public 関数 / D105: マジックメソッド /
# D106: public なネストしたクラス / D107: __init__ / D417: Parameters 節に引数の説明が漏れている。
# numpy 規約は D107・D417 を既定で外すが、ここで明示して有効にしている。
# モジュール・パッケージの docstring（D100・D104）は任意のため有効にしない。
# private（_ 付き）の関数・クラスは ruff では検出できないが、規約として同じく docstring を書く。
extend-select = ["D101", "D102", "D103", "D105", "D106", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
# NumPy 形式（Parameters / Returns / Raises の節）で書く。D417 は Parameters 節を見て判定する
convention = "numpy"

[tool.mypy]
# 標準実行コマンド: `cd waha-emulator && uv run mypy`
files = ["waha_emulator", "tests"]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# 結合テストで読み込む server-local のパッケージ（`app`）は型検査の対象外にする
module = ["app", "app.*"]
ignore_missing_imports = true
follow_imports = "skip"
