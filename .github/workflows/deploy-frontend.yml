name: Deploy Frontend

on:
  workflow_call:

# id-token: write でOIDCトークンの発行を許可する(AWSへのOIDC認証に必須)
# contents: read はコード取得のみに権限を絞るため明示
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 20は2026-04でEOLのため24を使う(Vite 8の要件 ^20.19.0 || >=22.12.0 も満たす)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # frontend/ のテストを実行するCIワークフローは他にないため、配信前にlint・単体テストを通す
      - run: npm run lint
      - run: npx vitest run
      # vite build は mode=production で動き、git管理の frontend/.env(VITE_API_URL=http://localhost:8000)を
      # frontend/.env.production(VITE_API_URL=空)で上書きする。CloudFrontが/api・/backend/authをbackendへ
      # プロキシする構成のため、APIは配信元と同じオリジンの相対パスで呼ぶ(ローカルURLや本家のドメインを含めない)。
      # 認証APIは画面(/auth/login 等)と衝突しないよう VITE_AUTH_API_URL=/backend を付けて呼ぶ(#240)
      - run: npm run build

      # OIDCトークンをAWSに提示し、一時クレデンシャルを受け取る
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist s3://${{ vars.FRONTEND_BUCKET_NAME }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'
