name: Deploy

# developへのpushでは、backend/frontendだけを自動デプロイする。
# インフラ(terraform apply)は、構成を作り直す間に意図せず適用されないよう、手動実行で
# run_infraをtrueにしたときだけ実行する(#381)。
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_infra:
        description: "インフラ(terraform apply)も実行する"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  # このpushでどのディレクトリが変更されたかを判定し、後続ジョブのif条件に使う出力を出す
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
            frontend:
              - "frontend/**"

  # 手動実行でrun_infraがtrueのときだけ deploy-infra.yml を呼び出す(secrets: inherit で
  # このワークフローに渡っているsecretsをそのまま呼び出し先にも渡す)。pushではスキップされる。
  # 手動実行はpush以外でパスの変更判定の比較元が定まらないため、判定には頼らない。
  infra:
    if: github.event_name == 'workflow_dispatch' && inputs.run_infra
    uses: ./.github/workflows/deploy-infra.yml
    secrets: inherit

  # backend/**が変更されていれば実行。infraジョブの完了を待つ(needs)。
  # infraジョブがスキップされた(infra/**が変更されていない)場合はresultが"skipped"になるので、
  # successかskippedのどちらかであればOKとする。infraが失敗した場合(failure)は実行しない。
  backend:
    needs: [changes, infra]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  # frontend/**(React)が変更されていれば実行。frontendが使うS3バケット/CloudFrontが
  # 同じPRのinfra変更で作り直される可能性があるため、backendと同様にinfraジョブの完了を待つ
  frontend:
    needs: [changes, infra]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
