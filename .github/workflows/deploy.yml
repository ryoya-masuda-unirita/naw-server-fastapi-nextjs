name: Deploy

# developへのpushでは、server/frontendだけを自動デプロイする。
# インフラ(terraform apply)は、構成を作り直す間に意図せず適用されないよう、手動実行で
# run_infraをtrueにしたときだけ実行する(#381)。
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_infra:
        description: "インフラ(terraform apply)も実行する"
        type: boolean
        default: false

# 全体の権限は読み取りだけにする。AWSのロールを引き受けるジョブ(infra・backend・frontend)にだけ、
# 下のジョブ側で id-token: write を渡す
permissions:
  contents: read

# develop への連続したpushで、デプロイが並走しないようにする(ECSのupdate-service・タスク定義の登録・
# migrateの実行が競合するため)。実行中のデプロイは止めずに終わらせ、待っている間に積まれたものは
# 最新だけが残る(最新のコミットが、それまでの変更も含むため)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # このpushでどのディレクトリが変更されたかを判定し、後続ジョブのif条件に使う出力を出す
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - "secuaigent-infra/**"
            backend:
              - "server/**"
            frontend:
              - "client/**"

      # インフラは自動適用しない(#381)ため、secuaigent-infra/**の変更を含むpushでは、server/frontendの新しいコードが
      # 古いインフラの上にデプロイされうる。気づけるよう警告を出す(インフラを先に手動で反映すること)。
      - name: Warn about unapplied infra changes
        if: github.event_name == 'push' && steps.filter.outputs.infra == 'true'
        run: |
          echo "::warning::secuaigent-infra/** の変更が含まれていますが、インフラは自動適用されません。server/clientより先に、Deployを手動実行(run_infra=true)して反映してください。"

  # 手動実行でrun_infraがtrueのときだけ deploy-infra.yml を呼び出す(secrets: inherit で
  # このワークフローに渡っているsecretsをそのまま呼び出し先にも渡す)。pushではスキップされる。
  # 手動実行はpush以外でパスの変更判定の比較元が定まらないため、判定には頼らない。
  infra:
    if: github.event_name == 'workflow_dispatch' && inputs.run_infra
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-infra.yml
    secrets: inherit

  # server/**が変更されていれば実行。infraジョブの完了を待つ(needs)。
  # infraジョブはpushでは常にスキップ(手動実行でrun_infra=trueのときだけ実行)されてresultが"skipped"に
  # なるので、successかskippedのどちらかであればOKとする。infraが失敗した場合(failure)は実行しない。
  backend:
    needs: [changes, infra]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  # client/**(React)が変更されていれば実行。手動実行でinfraも同時に動かす場合、frontendが使う
  # S3バケット/CloudFrontが作り直される可能性があるため、backendと同様にinfraジョブの完了を待つ
  frontend:
    needs: [changes, infra]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
