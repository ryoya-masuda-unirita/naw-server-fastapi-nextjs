name: プロジェクトステータス同期

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  move-to-review:
    name: Reviewへ移動
    # Projects v2 requires a PAT with `project` scope (github.token cannot get it)
    if: github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 紐づくIssueをReviewへ移動
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .codex/skills/naw-issue-workflow/scripts/project_status_sync.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --status "Review"

  move-to-done:
    name: Doneへ移動
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 紐づくIssueをDoneへ移動
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .codex/skills/naw-issue-workflow/scripts/project_status_sync.sh \
            --pr "${{ github.event.pull_request.number }}" \
            --status "Done"
