# 生成AIアダプタ・検索アダプタ・埋め込みアダプタ（generative-ai-adapter/。uv ワークスペース: core・各アダプタ）と、
# それを呼ぶ Waha! エミュレーター（waha-emulator/）のテスト・Ruff・mypy を検証するワークフロー。
# 書き方は server-local-tests.yml に揃えている。
# エミュレーターはアダプタをパス依存で使い、結合テストで server-local のコードも読み込むため、
# どれかを変更した PR・push で両方を流す。

name: 生成AIアダプタ・エミュレーターのテスト

on:
  pull_request:
    paths:
      - "generative-ai-adapter/**"
      - "waha-emulator/**"
      - "secuaigent-server-local/**"
      - ".github/workflows/generative-ai-adapter-tests.yml"
  push:
    paths:
      - "generative-ai-adapter/**"
      - "waha-emulator/**"
      - "secuaigent-server-local/**"
      - ".github/workflows/generative-ai-adapter-tests.yml"

jobs:
  # 生成AIアダプタ・検索アダプタ・埋め込みアダプタ。LLM・クラウド・DB への接続はテスト内でモックするため、外部サービスは要らない。
  adapter:
    name: 生成AIアダプタ・検索・埋め込みアダプタ
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generative-ai-adapter
    steps:
      - uses: actions/checkout@v4

      - name: uvをインストール
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --locked: uv.lock と pyproject.toml がずれていたら失敗させる
      - name: 依存関係をインストール
        run: uv sync --locked

      - name: テストを実行
        run: uv run pytest -q

      # 検証だけ行う（--fix は付けない）。pyproject.toml で有効にした D ルール（numpy）も検査される
      - name: フォーマットを検証
        run: uv run ruff format --check .

      - name: リンターを実行
        run: uv run ruff check .

      # core と各 adapter の tests に同名の conftest.py があるため、別々に実行する
      - name: 型を検査（core）
        run: uv run mypy generative-ai-core

      - name: 型を検査（生成AIアダプタ）
        run: uv run mypy generative-ai-adapter

      - name: 型を検査（検索アダプタ）
        run: uv run mypy retrieval-adapter

      - name: 型を検査（埋め込みアダプタ）
        run: uv run mypy embedding-adapter

  # Waha! エミュレーター。アダプタ（パス依存）と server-local（結合テスト）を使う。
  emulator:
    name: Waha!エミュレーター
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waha-emulator
    steps:
      - uses: actions/checkout@v4

      - name: uvをインストール
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: uv sync --locked

      - name: テストを実行
        run: uv run pytest -q

      - name: フォーマットを検証
        run: uv run ruff format --check .

      # pyproject.toml の [tool.ruff.lint] で有効にした D101〜D107・D417（numpy 規約）もここで検査される（Issue #311）
      - name: リンターを実行
        run: uv run ruff check .

      - name: 型を検査
        run: uv run mypy

  # Waha! エミュレーターのワークフローエディター（waha-emulator/ui/。React）。
  # lint・型チェック・単体テスト・ビルドを 1 ジョブで行う（ジョブを分けると npm ci が重なるため）。
  emulator-ui:
    name: Waha!エミュレーター画面
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waha-emulator/ui
    steps:
      - uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: waha-emulator/ui/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: リンターを実行
        run: npm run lint

      - name: 型を検査
        run: npm run type-check

      - name: テストを実行
        run: npm test

      - name: ビルド
        run: npm run build

      # onprem/docker-compose.yml の waha-emulator-ui と同じイメージ。Dockerfile・nginx の設定の誤りを、
      # compose を手で動かす前に見つける。中継先は、名前を引かない設計（resolver）のため、仮の値でよい
      - name: Docker イメージをビルドし、nginx の設定を検証
        run: |
          docker build -t waha-emulator-ui .
          docker run --rm -e WAHA_UPSTREAM=http://waha-emulator:8080 waha-emulator-ui nginx -t
