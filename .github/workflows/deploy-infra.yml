name: Deploy Infra

on:
  workflow_call:

# id-token: write でOIDCトークンの発行を許可する(AWSへのOIDC認証に必須)
# contents: read はコード取得のみに権限を絞るため明示
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    # インフラ用ロール(広い権限)は、この Environment を使うジョブだけが引き受けられる(OIDCの信頼条件が
    # repo:<リポジトリ>:environment:infra に限られる)。承認者・対象ブランチ(develop)は、Environment の設定で付ける(README参照)。
    environment: infra
    defaults:
      run:
        working-directory: secuaigent-infra/environments/dev
    steps:
      - uses: actions/checkout@v4

      # CloudFront Functionの書き換えロジックを、AWSへ反映する前に単体テストする(#240)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: CloudFront Functions Test
        run: node --test ../../modules/frontend/functions/functions.test.mjs

      # 未登録のままだと、AWS認証のステップが分かりにくいエラーで失敗するため、先に検査する
      - name: Check infra role secret
        env:
          AWS_INFRA_ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
        run: |
          if [ -z "$AWS_INFRA_ROLE_ARN" ]; then
            echo "::error::GitHubのSecret AWS_INFRA_ROLE_ARN が未登録です。インフラ用ロールは、既定では作られません。README「GitHub ActionsのAWSロール」の手順(Environment infra の保護 → enable_github_actions_infra_role=true でローカルapply → Secret登録)で用意してください。"
            exit 1
          fi

      # OIDCトークンをAWSに提示し、一時クレデンシャルを受け取る。以降のterraformコマンドはこの認証情報を使う。
      # インフラ用ロール(AWS_INFRA_ROLE_ARN)を使う。backend・frontendのデプロイが使うデプロイ用ロール(AWS_ROLE_ARN)とは別
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # state用バケット名・プロジェクト名はアカウント/環境ごとに異なるため、GitHubのVariableで渡す。
      # 未登録のままだと後続の失敗理由が分かりにくいので、先に検査する。
      - name: Check required variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::GitHubのVariable TF_STATE_BUCKET が未登録です。secuaigent-infra/bootstrap の出力 state_bucket_name を登録してください。"
            exit 1
          fi
          # 改行や空白が混ざる(terraform outputを-rawなしで登録した等)と、initが分かりにくいS3エラーで失敗するため
          if ! [[ "$TF_STATE_BUCKET" =~ ^[a-z0-9.-]{3,63}$ ]]; then
            echo "::error::TF_STATE_BUCKET の値がS3バケット名の形式ではありません(小文字・数字・ . ・ - の3〜63文字)。"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::GitHubのVariable PROJECT_NAME が未登録です。インフラのリソース名の元になる名前(例: naw-fastapi)を登録してください。"
            exit 1
          fi
          # ALBの名前は32文字までなので、接尾辞の分を見込んで30文字までにする
          if ! [[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$ ]]; then
            echo "::error::PROJECT_NAME の値が不正です(小文字・数字・ハイフンの3〜30文字)。"
            exit 1
          fi

      # backendのS3設定(main.tf)にバケット名を足して、リモートstateへ接続する
      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
      
      - name: Terraform Format Check
        # modules/ 配下にほとんどのHCLがあるため、-recursiveで ../.. (secuaigent-infra/) 全体を検査する
        run: terraform fmt -check -diff -recursive ../..
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        env:
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS }}
          TF_VAR_allowed_admin_cidrs: ${{ secrets.ALLOWED_ADMIN_CIDRS }}
          TF_VAR_key_pair_name: ${{ vars.KEY_PAIR_NAME }}
          TF_VAR_tfstate_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
        run: terraform plan -out=tfplan
      
      - name: Terraform Apply
        env:
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS }}
          TF_VAR_allowed_admin_cidrs: ${{ secrets.ALLOWED_ADMIN_CIDRS }}
          TF_VAR_key_pair_name: ${{ vars.KEY_PAIR_NAME }}
          TF_VAR_tfstate_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
        run: terraform apply -auto-approve tfplan