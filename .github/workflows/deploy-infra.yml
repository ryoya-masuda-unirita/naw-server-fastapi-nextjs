name: Deploy Infra

on:
  workflow_call:

# id-token: write でOIDCトークンの発行を許可する(AWSへのOIDC認証に必須)
# contents: read はコード取得のみに権限を絞るため明示
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev
    steps:
      - uses: actions/checkout@v4

      # CloudFront Functionの書き換えロジックを、AWSへ反映する前に単体テストする(#240)
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: CloudFront Functions Test
        run: node --test ../../modules/frontend/functions/functions.test.mjs

      # OIDCトークンをAWSに提示し、一時クレデンシャルを受け取る。以降のterraformコマンドはこの認証情報を使う
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # state用バケット名・プロジェクト名はアカウント/環境ごとに異なるため、GitHubのVariableで渡す。
      # 未登録のままだと後続の失敗理由が分かりにくいので、先に検査する。
      - name: Check required variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::GitHubのVariable TF_STATE_BUCKET が未登録です。infra/bootstrap の出力 state_bucket_name を登録してください。"
            exit 1
          fi
          # 改行や空白が混ざる(terraform outputを-rawなしで登録した等)と、initが分かりにくいS3エラーで失敗するため
          if ! [[ "$TF_STATE_BUCKET" =~ ^[a-z0-9.-]{3,63}$ ]]; then
            echo "::error::TF_STATE_BUCKET の値がS3バケット名の形式ではありません(小文字・数字・ . ・ - の3〜63文字)。"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::GitHubのVariable PROJECT_NAME が未登録です。インフラのリソース名の元になる名前(例: naw-fastapi)を登録してください。"
            exit 1
          fi
          # ALBの名前は32文字までなので、接尾辞の分を見込んで30文字までにする
          if ! [[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$ ]]; then
            echo "::error::PROJECT_NAME の値が不正です(小文字・数字・ハイフンの3〜30文字)。"
            exit 1
          fi

      # backendのS3設定(main.tf)にバケット名を足して、リモートstateへ接続する
      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
      
      - name: Terraform Format Check
        # modules/ 配下にほとんどのHCLがあるため、-recursiveで ../.. (infra/) 全体を検査する
        run: terraform fmt -check -diff -recursive ../..
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS }}
          TF_VAR_allowed_admin_cidrs: ${{ secrets.ALLOWED_ADMIN_CIDRS }}
          TF_VAR_key_pair_name: ${{ vars.KEY_PAIR_NAME }}
          TF_VAR_tfstate_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
        run: terraform plan -out=tfplan
      
      - name: Terraform Apply
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_secret_key: ${{ secrets.SECRET_KEY }}
          TF_VAR_allowed_ssh_cidrs: ${{ secrets.ALLOWED_SSH_CIDRS }}
          TF_VAR_allowed_admin_cidrs: ${{ secrets.ALLOWED_ADMIN_CIDRS }}
          TF_VAR_key_pair_name: ${{ vars.KEY_PAIR_NAME }}
          TF_VAR_tfstate_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
        run: terraform apply -auto-approve tfplan