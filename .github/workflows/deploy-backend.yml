name: Deploy Backend

on:
  workflow_call:

# id-token: write でOIDCトークンの発行を許可する(AWSへのOIDC認証に必須)
# contents: read はコード取得のみに権限を絞るため明示
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  # インフラ(deploy-infra.yml)のTF_VAR_project_nameと同じVariable。リソース名はここから組み立てる(下のステップ)
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # リポジトリのコードをこのジョブの実行環境にダウンロードする(これが無いとbackend/配下のファイルにアクセスできない)
      - uses: actions/checkout@v4

      # インフラ側(infra/modules)が作るリソース名と同じ規則で、プロジェクト名から組み立てる。
      # envの値は他のenvを参照できないため、ステップで組み立てて$GITHUB_ENVに書き出す。
      # 未登録・不正のまま進むと、存在しないリソースを指して分かりにくい失敗になるので、先に検査する。
      - name: Resolve resource names
        run: |
          if [ -z "$PROJECT_NAME" ]; then
            echo "::error::GitHubのVariable PROJECT_NAME が未登録です。インフラのリソース名の元になる名前(例: naw-fastapi)を登録してください。"
            exit 1
          fi
          if ! [[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$ ]]; then
            echo "::error::PROJECT_NAME の値が不正です(小文字・数字・ハイフンの3〜30文字)。"
            exit 1
          fi
          {
            echo "ECR_REPOSITORY=${PROJECT_NAME}-backend"
            echo "ECS_CLUSTER=${PROJECT_NAME}-cluster"
            echo "ECS_SERVICE=${PROJECT_NAME}-backend"
            echo "ECS_MIGRATE_TASK_FAMILY=${PROJECT_NAME}-backend-migrate"
          } >> "$GITHUB_ENV"

      # OIDCトークンをAWSに提示し、一時クレデンシャルを受け取る。以降のawsコマンド/dockerのECR操作はこの認証情報を使う
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `docker push`できるように、ECRへの一時的なログイントークンを取得する
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # GitHub Actionsのランナーはx86_64だが、ECSのFargateタスクはARM64(runtime_platformで指定)で動くため、
      # 異なるCPUアーキテクチャ向けのイメージをビルドできるようQEMU(エミュレータ)とBuildxを準備する
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ARM64向けにDockerイメージをビルドし、そのままECRにpushする(--pushでbuildとpushを1コマンドにまとめている)。
      # タグはcommit SHA(バージョン管理用)とlatest(常に最新を指す用)の2本を付ける
      - name: Build Docker image
        env:
          # ログインしたECRのリポジトリを環境変数に設定
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest \
            .

      # backend同様、DBマイグレーション専用タスク定義(backend_migrate)も今回pushしたイメージタグに更新する
      - name: Render migration task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition ${ECS_MIGRATE_TASK_FAMILY} \
            --query 'taskDefinition' > migrate-task-definition.json

          jq --arg IMAGE "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            migrate-task-definition.json > migrate-task-def-clean.json

      - name: Register migration task definition
        id: register-migrate-task-def
        run: |
          NEW_MIGRATE_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migrate-task-def-clean.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=${NEW_MIGRATE_TASK_DEF_ARN}" >> $GITHUB_OUTPUT

      # 新しいアプリコードが依存するスキーマ変更を先に反映するため、backendサービスの更新より前に実行する。
      # Fargateの一時タスクには、サブネットとセキュリティグループの指定が要る。CIに固定値を持たせず、
      # 稼働中のbackendサービスのネットワーク設定(privateサブネット・ECSのSG・パブリックIPなし)をそのまま使う。
      - name: Run DB migration task
        id: run-migration
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster ${ECS_CLUSTER} --services ${ECS_SERVICE} \
            --query 'services[0].networkConfiguration' --output json)
          if [ -z "${NETWORK_CONFIG}" ] || [ "${NETWORK_CONFIG}" = "null" ]; then
            echo "::error::サービス ${ECS_SERVICE} のネットワーク設定を取得できません。サービスが存在することを確認してください。"
            exit 1
          fi
          RUN_RESULT=$(aws ecs run-task \
            --cluster ${ECS_CLUSTER} \
            --task-definition ${{ steps.register-migrate-task-def.outputs.task_def_arn }} \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIG}" \
            --count 1 \
            --output json)
          MIGRATION_TASK_ARN=$(echo "${RUN_RESULT}" | jq -r '.tasks[0].taskArn // empty')
          # 起動に失敗するとtasksが空になり、taskArnが得られない(後続が分かりにくく失敗する)ため、ここで理由を出して止める
          if [ -z "${MIGRATION_TASK_ARN}" ]; then
            echo "::error::マイグレーションのタスクを起動できません: $(echo "${RUN_RESULT}" | jq -c '.failures')"
            exit 1
          fi
          echo "task_arn=${MIGRATION_TASK_ARN}" >> $GITHUB_OUTPUT

      - name: Wait for migration task to stop
        run: |
          aws ecs wait tasks-stopped \
            --cluster ${ECS_CLUSTER} \
            --tasks ${{ steps.run-migration.outputs.task_arn }}

      # マイグレーションが失敗している場合、ここでジョブを止めて後続のbackendサービス更新に進ませない
      - name: Check migration exit code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${ECS_CLUSTER} \
            --tasks ${{ steps.run-migration.outputs.task_arn }} \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "DB migration failed (exit code: ${EXIT_CODE})"
            exit 1
          fi

      # 今ECSに登録されている現行のタスク定義をJSONで取得し、コンテナイメージだけを新しいタグに書き換えた
      # 「新しいタスク定義の中身」を作る。ecs register-task-definitionが受け付けないメタ情報(リビジョン番号等)は
      # jqで削除する(付けたままだとAPIエラーになる)
      - name: Render new task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition ${ECS_SERVICE} \
            --query 'taskDefinition' > task-definition.json

          jq --arg IMAGE "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-def-clean.json

      # 上で作った内容を、ECS上に新しい「リビジョン」として登録する(まだサービスはこれを使っていない状態)。
      # 登録後に払い出されるARN(リビジョン番号込みの識別子)を、次のステップで使うために保存しておく
      - name: Register new task definition
        id: register-task-def
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-clean.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=${NEW_TASK_DEF_ARN}" >> $GITHUB_OUTPUT

      # ECSサービスに「さっき登録した新しいリビジョンを使って再デプロイして」と指示する。
      # --force-new-deploymentを付けないと、ECSは:latestタグの中身が変わったことを自動検知してくれないため必須
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
            --force-new-deployment

      # 新しいタスクが起動しヘルスチェックを通過して安定するまで、このジョブを待たせる。
      # ここで失敗する場合、新しいイメージが正常に起動できていない(設定ミス等)ことを示す
      - name: Wait for service stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE}
