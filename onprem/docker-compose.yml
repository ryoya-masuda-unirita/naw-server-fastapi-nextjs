name: naw-onprem

services:
  # 社内の SECURE の窓口（ブラウザから質問を受け、Waha! で回答を作る）
  server-local:
    build: ../secuaigent-server-local
    ports:
      - "127.0.0.1:18090:8080"
    environment:
      SECURITY_SERVER_AUTH_KEY: ${SERVER_LOCAL_AUTH_KEY:-onprem-local-key}
      WAHA_URL: http://waha-emulator:8080/
      WAHA_AUTHKEY: ${WAHA_AUTHKEY:-onprem-waha-key}
      NAW_BASE_URL: ${NAW_BASE_URL:-http://host.docker.internal:8001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Tokyo
    volumes:
      - server-local-data:/app/data
      - stream-output:/app/data/stream-output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/hello', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      waha-emulator:
        condition: service_healthy

  # Waha!（とアダプタ）の代わり
  waha-emulator:
    build:
      context: ..
      dockerfile: waha-emulator/Dockerfile
    ports:
      - "127.0.0.1:18091:8080"
    environment:
      WAHA_AUTHKEY: ${WAHA_AUTHKEY:-onprem-waha-key}
      LLM_PROVIDER: ${LLM_PROVIDER:-echo}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      # 埋め込みの学習で、filepath で渡されたパスを読んでよいディレクトリ（下の file-server のマウント先）
      SOURCE_ALLOWED_DIR: /mnt/file-server
      # 画面（waha-emulator-ui）で組んだワークフローの保存先。設定すると管理用 API（/admin）が有効になる
      WAHA_STUDIO_DIR: /app/data/workflows
      # サービス ID ごとの設定（/app/config の例、Bedrock の定義など）。Bedrock の拡張とは別に使う
      WAHA_WORKFLOWS_FILE: ${WAHA_WORKFLOWS_FILE:-}
      # bedrock-ext: Bedrock で動かすときだけ使う（手順は README の「Bedrock で動かす」）
      BEDROCK_API_KEY: ${BEDROCK_API_KEY:-}  # bedrock-ext
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Tokyo
    volumes:
      - stream-output:/app/data/stream-output
      - waha-workflows:/app/data/workflows
      - ./file-server:/mnt/file-server:ro
      # ワークフロー定義の例（workflows.example.json など）。WAHA_WORKFLOWS_FILE=/app/config/... で指定する
      - ../waha-emulator/config:/app/config:ro
      - ./config:/app/onprem-config:ro  # bedrock-ext
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080), 3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ワークフローエディター（画面）。ブラウザでノードと線を組み、保存したワークフローを、
  # サービス ID で server-local から呼べる。管理用 API（/admin）だけをエミュレーターへ中継する
  waha-emulator-ui:
    build: ../waha-emulator/ui
    ports:
      # 認証のない管理用 API を中継するため、ホストの 127.0.0.1 だけに公開する
      - "127.0.0.1:18092:80"
    environment:
      WAHA_UPSTREAM: http://waha-emulator:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      waha-emulator:
        condition: service_healthy

  # アダプタが使うベクトルDB（PostgreSQL + pgvector + PGroonga + Apache AGE）
  vector-db:
    build: ./vector-db
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: onprem_vector
      POSTGRES_USER: onprem_vector
      POSTGRES_PASSWORD: onprem_vector_password
      TZ: Asia/Tokyo
    volumes:
      - vector-db-data:/var/lib/postgresql/data
      - ./vector-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U onprem_vector -d onprem_vector"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  server-local-data:
  stream-output:
  waha-workflows:
  vector-db-data:
