[project]
name = "naw-generative-ai-core"
version = "0.1.0"
description = "移植元 generative-ai-core の Python 移植。Waha! に依存しない chat・provider・network・media の共通 runtime"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_ai_core"]
