[project]
name = "naw-generative-ai-core"
version = "0.1.0"
description = "移植元 generative-ai-core の Python 移植。Waha! に依存しない chat・provider・network・media・embedding・vector・graphrag の共通 runtime"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    # ベクトルDB（PostgreSQL + pgvector・PGroonga・Apache AGE）への接続（移植元の JDBC の代わり）。
    # 検索（retrieval）と保存・削除（vector・graphrag）が使う
    "psycopg[binary]>=3.2.0",
    # ファイル前処理（移植元の Apache POI・PDFBox・Tika の代わり）
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "python-pptx>=1.0.0",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_ai_core"]
