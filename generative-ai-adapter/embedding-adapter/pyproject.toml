[project]
name = "naw-embedding-adapter"
version = "0.1.0"
description = "移植元 embedding-adapter（Waha! の埋め込みアダプタ）の Python 移植。文書の分割・ベクトル保存・更新・削除・Graph Candidate を core へ委譲する"
requires-python = ">=3.12"
dependencies = [
    "naw-generative-ai-core",
]

[tool.uv.sources]
naw-generative-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_adapter"]
