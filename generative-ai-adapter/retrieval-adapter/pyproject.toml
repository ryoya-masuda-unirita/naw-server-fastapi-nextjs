[project]
name = "naw-retrieval-adapter"
version = "0.1.0"
description = "移植元 retrieval-adapter（Waha! の生成AI検索アダプタ）の Python 移植。検索を core へ委譲し、LEGACY_TSV / RAG_CONTEXT_JSON_V1 で書き出す"
requires-python = ">=3.12"
dependencies = [
    "naw-generative-ai-core",
]

[tool.uv.sources]
naw-generative-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_adapter"]
