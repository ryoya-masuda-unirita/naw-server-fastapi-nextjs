[project]
name = "naw-generative-ai-adapter-workspace"
version = "0.1.0"
description = "移植元 generative-ai-adapter（Java）の Python 移植。core と各アダプタをまとめる uv ワークスペース"
requires-python = ">=3.12"
dependencies = [
    "naw-generative-ai-core",
    "naw-generative-ai-adapter",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # テストでは HTTP をモックする（実際の LLM には接続しない）
    "respx>=0.21.0",
]

[tool.uv]
# ルートはワークスペースの入れ物で、パッケージとしては作らない
package = false

[tool.uv.workspace]
# 移植元と同じ分け方。embedding-adapter・retrieval-adapter は後続の Issue で加える
members = ["generative-ai-core", "generative-ai-adapter"]

[tool.uv.sources]
naw-generative-ai-core = { workspace = true }
naw-generative-ai-adapter = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["generative-ai-core/tests", "generative-ai-adapter/tests"]
# core と adapter の tests に同じ名前のモジュールがあっても衝突しないようにする
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# 関数・メソッド・クラスに NumPy 形式の docstring（Parameters/Returns/Raises）を必須にする
extend-select = ["D101", "D102", "D103", "D105", "D106", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
# 標準実行コマンド（core と adapter の tests に同名の conftest.py があるため、別々に実行する）:
#   cd generative-ai-adapter && uv run mypy generative-ai-core && uv run mypy generative-ai-adapter
python_version = "3.12"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = ["generative-ai-core/src", "generative-ai-adapter/src"]
