[project]
name = "naw-generative-ai-adapter"
version = "0.1.0"
description = "移植元 generative-ai-adapter（Waha! の生成AIアダプタ）の Python 移植。通常 chat と RAG 回答を core へ委譲する"
requires-python = ">=3.12"
dependencies = [
    "naw-generative-ai-core",
]

[tool.uv.sources]
naw-generative-ai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generative_ai_adapter"]
