workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - test

client-test:
  tags:
    - secuaigent
  stage: test
  image: node:20
  variables:
    # 日付表示のテストが Asia/Tokyo 前提のため、CIコンテナのデフォルト(UTC)に合わせて明示する
    TZ: "Asia/Tokyo"
  rules:
    - changes:
        - client/**/*
  script:
    - cd client
    - npm ci
    # junit を先頭にすると --output-file が junit レポーターに適用される（default はコンソール出力のまま）
    - npm test -- --watch=false --reporters=junit --reporters=default --output-file=test-results/junit.xml
  artifacts:
    # テスト失敗時こそ結果を MR に表示したいので always にする
    when: always
    reports:
      junit: client/test-results/junit.xml
    expire_in: 1 week
