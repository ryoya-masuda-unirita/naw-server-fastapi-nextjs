<div class="shrink-0 flex flex-col bg-bg-primary z-30">
  <app-page-header
    title=""
    [titleKey]="'SIDEBAR.ASSISTANTS'"
    [showSidebarToggle]="true"
    [showActions]="false"
    [showLanguageToggle]="true"
    [showBackButton]="false"
    [tabs]="tabs()"
    [activeTabId]="activeTabId()"
    (tabChange)="onTabChange($event)"
  />
</div>

<!-- ===================== CONTENT ===================== -->
<div class="flex flex-1 min-h-0 overflow-hidden">
  @if (activeTabId() === 'assistant') {
    <app-assistant-tab />
  }

  @if (activeTabId() === 'assistant-category') {
    <app-category-tab />
  }
</div>
