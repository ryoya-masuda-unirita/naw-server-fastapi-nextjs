<app-admin-page-shell [titleKey]="'CHAT_HISTORY.TITLE'">
  <app-chat-history-filter
    [pageSize]="store.filter().pageSize"
    [pageIndex]="store.filter().pageIndex"
    [totalItems]="store.totalItems()"
    [totalPages]="store.totalPages()"
    [countDisplay]="countDisplay()"
    [userOptions]="userOptions()"
    (pageSizeChange)="store.updatePageSize($event)"
    (pageIndexChange)="store.updatePageIndex($event)"
    (filterChange)="onFilterChange($event)"
  />

  @if (store.isLoading()) {
    <div class="flex justify-center p-8">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  } @else {
    <app-chat-history-list [items]="store.items()" />

    @if (store.totalItems() > 0) {
      <div class="flex justify-center">
        <app-pagination
          [totalPages]="store.totalPages()"
          [useQueryParams]="false"
          [showPageSize]="false"
          [showFirstLast]="false"
          [currentPageOverride]="store.filter().pageIndex"
          (pageChange)="store.updatePageIndex($event)"
        />
      </div>
    }
  }
</app-admin-page-shell>
