<div class="flex flex-col gap-4 md:gap-6">
  <app-form-input
    label="APIの表示名"
    placeholder="APIの表示名を入力"
    [value]="formData().endpointName"
    (valueChange)="updateField('endpointName', $event)"
  />

  <app-form-select
    label="APIの接続先"
    placeholder="APIの接続先を選択"
    [options]="connectionOptions()"
    [value]="formData().type"
    (valueChange)="updateField('type', $event || '')"
    [disabled]="isEdit()"
    width="100%"
  />

  <app-form-input
    label="接続先のURL"
    placeholder="接続先のURLを入力"
    [value]="formData().endpoint"
    (valueChange)="updateField('endpoint', $event)"
  />

  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-1">
      <span class="text-label-large font-medium text-text-strong">APIキー</span>
    </div>
    <div class="mt-1">
      <div class="flex gap-1 items-start text-status-caution">
        <span class="shrink-0" aria-hidden="true">
          <app-svg-icon name="alert" class="w-5 h-5" />
        </span>
        <div class="flex-1 min-w-0 text-body-small">
          <p>
            「生成」を押下するとAPIキーが生成されます。<br />生成されたAPIキーは再度表示することはできませんので、記録しておいてください。
          </p>
        </div>
      </div>
    </div>
    <div class="flex flex-col md:flex-row items-start md:items-center gap-2 mt-2">
      <app-form-input
        label=""
        placeholder="APIキー"
        [disabled]="true"
        [value]="formData().apiKey"
        class="flex-1 min-w-0 w-full md:w-auto"
      />
      @if (apiKeyGenerated()) {
        <app-button
          variant="outline"
          size="lg"
          type="button"
          data-copy-btn
          [class.chat-message-action--copied]="isCopied()"
          (buttonClick)="copyApiKey()"
        >
          <span data-icon-default><app-svg-icon name="copy" class="w-5 h-5" /></span>
          <span data-icon-copied><app-svg-icon name="check" class="w-5 h-5" /></span>
          コピー
        </app-button>
      } @else {
        <app-button variant="outline" size="lg" type="button" (buttonClick)="generateApiKey()"
          >生成</app-button
        >
      }
    </div>
  </div>
</div>
