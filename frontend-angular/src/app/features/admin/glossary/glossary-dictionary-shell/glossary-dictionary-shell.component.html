<header class="shrink-0 flex flex-col bg-bg-primary z-30 border-b border-border-strong">
  <!-- Row matches lime0422 Header.astro `term-word-page`: px-2 py-2 md:px-6 md:py-3; back ml-3 md:ml-0 md:mr-2 -->
  <div class="flex items-center px-2 py-2 md:px-6 md:py-3">
    <button
      type="button"
      class="lg:p-2 rounded-lg hover:bg-slate-100 shrink-0 md:hidden p-1"
      (click)="toggleSidebar()"
      [title]="'HEADER.SIDEBAR_TOGGLE' | translate"
    >
      <img
        src="/icons/icon-side-navigation.svg"
        [alt]="'HEADER.SIDEBAR_TOGGLE' | translate"
        class="size-5"
      />
    </button>
    <app-icon-button
      variant="tertiary-gray"
      class="ml-3 md:ml-0! md:mr-2! shrink-0"
      [link]="'/' + glossaryBasePath"
      [ariaLabel]="'COMMON.BACK' | translate"
    >
      <app-svg-icon name="arrowLeft" class="w-5 h-5" />
    </app-icon-button>
    <div class="page-header">
      <h1 class="page-header-title min-w-0 truncate">{{ dictionaryTitle() }}</h1>
      <div class="dropdown shrink-0">
        <ng-template #dictMenuTrigger>
          <button
            type="button"
            class="icon-button icon-button-tertiary-gray w-7 h-7 md:w-9 md:h-9 dropdown-trigger"
            [attr.aria-label]="'ADMIN.GLOSSARY.DICT_SETTINGS_ARIA' | translate"
            [attr.aria-haspopup]="'menu'"
          >
            <app-svg-icon name="edit" class="w-5 h-5" />
          </button>
        </ng-template>

        <app-context-menu
          [customTrigger]="dictMenuTrigger"
          [menuTpl]="dictMenuTpl"
          panelClass="dropdown-menu dropdown-menu--bordered w-70"
          menuMinWidth=""
        />
      </div>
    </div>
  </div>

  <ng-template #dictMenuTpl>
    <button type="button" class="dropdown-item" role="menuitem" (click)="openEditDictionary()">
      <span class="dropdown-item-icon">
        <app-svg-icon name="edit" class="w-5 h-5" />
      </span>
      {{ 'ADMIN.GLOSSARY.MENU_EDIT_DICT' | translate }}
    </button>
    <hr class="dropdown-divider" />
    <button
      type="button"
      class="dropdown-item dropdown-item--danger"
      role="menuitem"
      (click)="openDeleteDictionary()"
    >
      <span class="dropdown-item-icon">
        <app-svg-icon name="delete" class="w-5 h-5" />
      </span>
      {{ 'ADMIN.GLOSSARY.MENU_DELETE_DICT' | translate }}
    </button>
  </ng-template>
  <div class="md:mt-0 flex items-center gap-1 overflow-hidden">
    <app-tab [tabs]="dictionaryTabs()" [activeTabId]="activeTabId() || ''" />
  </div>
</header>

<div class="flex flex-1 min-h-0 overflow-hidden">
  <main class="term-main md:pb-0 flex-1 min-h-0 overflow-auto">
    <router-outlet class="hidden" />
  </main>
</div>

<ng-template #editDictForm>
  <div class="flex flex-col gap-4 md:gap-6">
    <app-form-input
      [label]="'ADMIN.GLOSSARY.TERM_NAME_LABEL' | translate"
      [supportText]="'ADMIN.GLOSSARY.TERM_NAME_SUPPORT' | translate"
      [value]="editDictName()"
      (valueChange)="editDictName.set($event)"
      [maxLength]="32"
      [error]="editDictNameError()"
      class="gap-1"
    />
    <app-form-textarea
      [label]="'ADMIN.GLOSSARY.TERM_DESCRIPTION_LABEL' | translate"
      [badgeText]="'COMMON.OPTIONAL' | translate"
      [supportText]="'ADMIN.GLOSSARY.TERM_NAME_SUPPORT' | translate"
      [value]="editDictDesc()"
      (valueChange)="editDictDesc.set($event)"
      [maxLength]="1000"
      [error]="editDictDescError()"
      [rows]="4"
      class="gap-0"
      [textareaClass]="'min-h-36!'"
    />
    <app-combobox-multi
      id="edit-dict-assistant"
      name="assistantIds"
      [label]="'ADMIN.GLOSSARY.ASSIGNED_ASSISTANT' | translate"
      [badgeText]="'COMMON.OPTIONAL' | translate"
      [supportText]="'ADMIN.GLOSSARY.ASSISTANT_SUPPORT' | translate"
      [placeholder]="'ADMIN.GLOSSARY.ASSISTANT_PLACEHOLDER' | translate"
      [searchHint]="'ADMIN.GLOSSARY.SEARCH_HINT' | translate"
      panelSize="full"
      [options]="glossaryMock.assistantOptions()"
      [value]="editDictAssistants()"
      (valueChange)="editDictAssistants.set($event)"
      class="gap-1"
    />
  </div>
</ng-template>

<ng-template #editDictActions>
  <div class="flex gap-3 justify-end max-sm:justify-center">
    <app-button
      variant="outline"
      size="lg"
      class="dialog-cancel-btn flex-1"
      [fullWidth]="true"
      (buttonClick)="closeDialogs()"
    >
      {{ 'COMMON.CANCEL' | translate }}
    </app-button>
    <app-button
      variant="solid"
      size="lg"
      class="flex-1"
      [fullWidth]="true"
      (buttonClick)="saveEditDictionary()"
      [disabled]="editDictSubmitted() && !canSaveDictionary()"
    >
      {{ 'COMMON.SAVE' | translate }}
    </app-button>
  </div>
</ng-template>
