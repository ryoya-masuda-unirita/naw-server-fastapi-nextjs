<div class="p-6">
  <div class="mb-6">
    <a
      routerLink="/admin/users"
      class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-700 text-sm no-underline"
    >
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path
          fill="currentColor"
          d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
        />
      </svg>
      Back to Users
    </a>
  </div>

  <div class="max-w-2xl bg-white rounded-xl p-8 shadow-sm">
    <h1 class="text-2xl font-bold mb-6">{{ isEditMode() ? 'Edit User' : 'Add New User' }}</h1>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="firstName" class="text-sm font-medium text-gray-700">First Name *</label>
          <input
            id="firstName"
            type="text"
            [(ngModel)]="firstName"
            name="firstName"
            placeholder="Enter first name"
            required
            class="px-4 py-3 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="lastName" class="text-sm font-medium text-gray-700">Last Name *</label>
          <input
            id="lastName"
            type="text"
            [(ngModel)]="lastName"
            name="lastName"
            placeholder="Enter last name"
            required
            class="px-4 py-3 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
          />
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-sm font-medium text-gray-700">Email Address *</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="user@example.com"
          required
          class="px-4 py-3 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="role" class="text-sm font-medium text-gray-700">Role *</label>
          <select
            id="role"
            [(ngModel)]="role"
            name="role"
            required
            class="px-4 py-3 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
          >
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="status" class="text-sm font-medium text-gray-700">Status *</label>
          <select
            id="status"
            [(ngModel)]="status"
            name="status"
            required
            class="px-4 py-3 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
          >
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      @if (!isEditMode()) {
        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-sm font-medium text-gray-700">Password *</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter password"
            required
            class="px-4 py-3 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
          />
        </div>
      }

      <div class="flex flex-col gap-1.5">
        <label for="bio" class="text-sm font-medium text-gray-700">Bio</label>
        <textarea
          id="bio"
          [(ngModel)]="bio"
          name="bio"
          placeholder="Tell us about this user..."
          rows="4"
          class="px-4 py-3 border border-slate-200 rounded-lg text-sm resize-y min-h-[100px] focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all"
        ></textarea>
      </div>

      <div class="flex justify-end gap-4 pt-4 border-t border-slate-100 mt-2">
        <a
          routerLink="/admin/users"
          class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium no-underline hover:bg-slate-200 transition-all"
        >
          Cancel
        </a>
        <button
          type="submit"
          [disabled]="isLoading()"
          class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-br from-indigo-500 to-purple-600 text-white rounded-lg text-sm font-medium transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-indigo-500/40 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none"
        >
          @if (isLoading()) {
            <span
              class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"
            ></span>
            Saving...
          } @else {
            {{ isEditMode() ? 'Update User' : 'Create User' }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
