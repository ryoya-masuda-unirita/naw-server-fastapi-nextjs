<fieldset class="avatar-upload">
  <!-- Header: label, support text, error message (based on old lines 18-23) -->
  <div class="fieldset-head">
    <label [for]="inputId()" class="fieldset-title">{{ label() }}</label>
    @if (supportText()) {
      <p class="fieldset-support-text">{{ supportText() }}</p>
    }
    @if (errorMessage()) {
      <p class="fieldset-error-message">
        <app-svg-icon name="warning" class="w-4 h-4 shrink-0" />{{ errorMessage() }}
      </p>
    }
  </div>

  <!-- Body: preview + controls (based on old lines 25-50) -->
  <div class="avatar-upload__body">
    <!-- Hidden file input -->
    <input
      type="file"
      [id]="inputId()"
      name="avatar"
      accept="image/*"
      class="sr-only"
      tabindex="-1"
      (change)="onFileSelect($event)"
    />

    <!-- Circular / square preview (based on old lines 26-34) -->
    <div class="avatar-upload__preview-wrapper">
      <div [class]="previewClass()">
        <span class="avatar-upload__placeholder" aria-hidden="true">
          @if (!avatarPreview() && !loading()) {
            <img
              src="icons/default-avt-icon.svg"
              alt="アイコン"
              class="w-full h-full"
              [class.rounded-full]="shape() === 'circle'"
              [class.rounded-xl]="shape() === 'square'"
            />
          }
          @if (loading()) {
            <div
              class="flex items-center justify-center absolute top-0 left-0 w-full h-full pointer-events-none"
            >
              <div class="w-6 h-6 animate-spin">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M24 12C24 18.6274 18.6274 24 12 24C5.37258 24 0 18.6274 0 12C0 5.37258 5.37258 0 12 0C18.6274 0 24 5.37258 24 12ZM3 12C3 16.9706 7.02944 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12Z"
                    fill="#15819A"
                    fill-opacity="0.2"
                  />
                  <path
                    d="M12 1.5C12 0.671573 11.3259 -0.0096574 10.5039 0.0936294C9.44209 0.227052 8.40064 0.502197 7.4078 0.913446C5.95189 1.5165 4.62902 2.40042 3.51472 3.51472C2.40041 4.62902 1.5165 5.95189 0.913445 7.4078C0.502197 8.40064 0.227051 9.44209 0.0936282 10.5039C-0.00965713 11.3259 0.671572 12 1.5 12C2.32843 12 2.98728 11.3239 3.12471 10.5069C3.23706 9.83908 3.4247 9.18448 3.68508 8.55585C4.13738 7.46392 4.80031 6.47177 5.63604 5.63604C6.47177 4.80031 7.46392 4.13738 8.55585 3.68508C9.18447 3.4247 9.83908 3.23706 10.5069 3.12471C11.3239 2.98728 12 2.32843 12 1.5Z"
                    fill="#15819A"
                  />
                </svg>
              </div>
            </div>
          }
        </span>
        @if (avatarPreview()) {
          <img [src]="avatarPreview()" alt="" class="avatar-upload__img" />
        }
      </div>
      @if (avatarPreview() || loading()) {
        <button
          type="button"
          class="avatar-upload__remove"
          [attr.aria-label]="'USER_SETTINGS.REMOVE_AVATAR' | translate"
          (click)="removeAvatar()"
        >
          <app-svg-icon name="close" class="w-3! h-3! text-white" />
        </button>
      }
    </div>

    <!-- Controls: filename + upload button (based on old lines 44-49) -->
    <div class="avatar-upload__controls">
      @if (fileName()) {
        <p class="avatar-upload__filename">{{ fileName() }}</p>
      }
      <label [for]="inputId()" class="avatar-upload__btn">
        <app-svg-icon name="fileUpload" class="w-4 h-4" />
        <span>{{ 'COMMON.BUTTONS.UPLOAD_FILE_BUTTON' | translate }}</span>
      </label>
    </div>
  </div>
</fieldset>
