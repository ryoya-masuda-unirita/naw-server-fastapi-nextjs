<!-- Back Button -->
<button
  (click)="onGoToBack()"
  class="w-full flex items-center gap-2 h-9 px-2 py-1.5 rounded-lg text-text-default hover:bg-bg-brand-weak transition-colors text-xs font-medium"
>
  <span class="flex items-center justify-center shrink-0 w-5 h-5">
    <span class="flex items-center justify-center shrink-0 w-7 h-7">
      <mat-icon class="icon-20">keyboard_return</mat-icon>
    </span>
    <span class="material-symbols-outlined"> </span>
  </span>
  @if (!uiStore.sidebarCollapsed()) {
    <span>{{ 'ADMIN.LIBRARY.BACK' | translate }}</span>
  }
</button>
