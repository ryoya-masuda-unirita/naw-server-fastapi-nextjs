# 専用環境の画面（SPA）の配信。存在しないパスは index.html に戻す（React Router の直接アクセス用）。
server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # ビルド済みの JS・CSS が無いときは 404 にする（index.html を 200 で返すと、JS の構文エラーに見えて原因が分かりにくい）
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
