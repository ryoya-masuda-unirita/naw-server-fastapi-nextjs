# e2e-spec（移植元の結合テスト項目書どおりに動くかを確かめる E2E）の専用環境。
# `npm run env:up`（src/environment.ts）が、プロジェクト名 naw-e2e-spec・別ポートで、リポジトリのルートを基準に起動する。
# 手元の開発環境（ルートの docker-compose.yml、naw-fastapi-*）・e2e-explorer には触れない（プロジェクト名・ポート・イメージ名・ボリュームが別）。
# ルートの compose と違い、backend は本番用のイメージ（server/Dockerfile）で、画面はビルド済みの静的ファイル（nginx）で配信する（#417）。
name: naw-e2e-spec

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://root:root@postgres:5432/postgres
  SECRET_KEY: e2e-spec-secret-not-for-production
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: http://localhost:${E2E_SPEC_FRONTEND_PORT:-55273}
  COOKIE_SECURE: "false"
  COOKIE_SAME_SITE: lax
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: ap-northeast-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_S3_BUCKET_NAME: secuaigent-user-import-jobs-dev-local
  AWS_SQS_QUEUE_URL: http://localstack:4566/000000000000/secuaigent-user-import-jobs-queue-dev-local

services:
  # backend の DB（PostgreSQL）
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      TZ: Asia/Tokyo
      PGDATA: /var/lib/postgresql/18/data
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # ログインセッションの保存先
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # AWS（S3・SQS）の偽物。ユーザーの一括登録で使う
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: ap-northeast-1
    volumes:
      - ./docker-compose/localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 40

  # DB のテーブルを作る（alembic のマイグレーション）
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${E2E_SPEC_BACKEND_IMAGE:-naw-e2e-spec-backend}
    environment: *backend-env
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # 初期データ（ログイン用のテナント・ユーザーとデモデータ）を入れる
  seed:
    image: postgres:18
    environment:
      PGPASSWORD: root
    volumes:
      - ./server/seed.sql:/seed/seed.sql:ro
      - ./server/seed-demo.sql:/seed/seed-demo.sql:ro
    command: ["sh", "-c", "psql -h postgres -U root -d postgres -v ON_ERROR_STOP=1 -q -f /seed/seed.sql && psql -h postgres -U root -d postgres -v ON_ERROR_STOP=1 -q -f /seed/seed-demo.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # FastAPI の backend
  backend:
    image: ${E2E_SPEC_BACKEND_IMAGE:-naw-e2e-spec-backend}
    environment: *backend-env
    ports:
      - "127.0.0.1:${E2E_SPEC_BACKEND_PORT:-58100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # チャットの回答用の LLM のモック（Azure OpenAI 互換。最後のユーザー発話をエコーする）。
  # テナントの接続先（tenant_endpoints）を spec-seed.sql でここに向ける。新しいイメージは作らず、backend のイメージ（Python）で動かす
  llm-mock:
    image: ${E2E_SPEC_BACKEND_IMAGE:-naw-e2e-spec-backend}
    command: ["python", "/mock/llm_mock.py"]
    volumes:
      - ./e2e-spec/docker/llm_mock.py:/mock/llm_mock.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 画面は Vite の開発サーバーではなく、ビルド済みの静的ファイルを nginx で配信する（#417）。
  # ポートは nginx.conf で 5173 を待ち受け、ホストへは E2E_SPEC_FRONTEND_PORT で公開する。
  frontend:
    build:
      context: ./client
      dockerfile: ../e2e-spec/docker/frontend.Dockerfile
      args:
        # ブラウザ（ホスト）から見た backend の URL。ビルド時にバンドルへ埋め込まれる
        VITE_API_URL: http://localhost:${E2E_SPEC_BACKEND_PORT:-58100}
    ports:
      - "127.0.0.1:${E2E_SPEC_FRONTEND_PORT:-55273}:5173"
    volumes:
      - ./e2e-spec/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
