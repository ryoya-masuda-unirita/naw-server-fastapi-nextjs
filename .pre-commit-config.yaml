repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
        files: ^backend/
      - id: ruff-check
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.97.1
    hooks:
      - id: terraform_fmt
        files: ^infra/
